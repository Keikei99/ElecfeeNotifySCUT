# 配置模板：复制为 config.yaml 后填写自己的信息。真实 config.yaml 已被 .gitignore 忽略。

session:
  jsessionid: "在此粘贴登录后浏览器里的 JSESSIONID"

credentials:
  enabled: false      # 有二次认证时保持 false；用 --login 交互式刷新会话
  student_id: ""
  password: ""

check:
  cooldown_hours: 24
  query_interval: [5, 6]    # 房间之间随机查询间隔(秒)，串行节流
  restore_home_room: true
  home_room:
    building: "C1"
    room: "101"
  session_alert_email: "admin@example.com"   # 会话过期时把“请重新登录”提醒发到这里

defaults:
  threshold_money: 10.0     # 订阅未指定阈值时的默认最低提醒金额(元)
  channels: ["email"]       # 通知渠道：email（可加 wechat）

smtp:
  host: "smtp.163.com"
  port: 465
  use_ssl: true
  username: "admin@example.com"
  password: "SMTP授权码"
  from_addr: "admin@example.com"

wechat:
  provider: "serverchan"   # serverchan 或 pushplus
  token: ""
