<!-- subject: ⚡电费助手 · 测试邮件 -->
<!--
  邮箱连通性测试邮件模板（--test）。可用变量：{{email}} 收件邮箱，{{now}} 当前时间。
-->
<div style="font-family:-apple-system,'PingFang SC',Helvetica,Arial,sans-serif;max-width:520px;margin:0 auto;color:#333;">
  <div style="background:#1e88e5;color:#fff;padding:16px 20px;border-radius:8px 8px 0 0;">
    <h2 style="margin:0;font-size:18px;">✅ 测试邮件</h2>
  </div>
  <div style="border:1px solid #eee;border-top:none;padding:20px;border-radius:0 0 8px 8px;">
    <p style="font-size:15px;margin:0;">这是一封测试邮件：华工宿舍电费通知系统的邮件通道正常。</p>
    <p style="font-size:14px;color:#888;margin:12px 0 0;">收件邮箱：{{email}}<br>发送时间：{{now}}</p>
  </div>
  <p style="color:#aaa;font-size:12px;text-align:center;margin-top:12px;">华工宿舍电费通知助手</p>
</div>
